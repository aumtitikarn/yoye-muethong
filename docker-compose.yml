services:
  booking:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-https://yoyemuethong-dev.yoyemuethong.com}
        - NEXT_PUBLIC_FILES_URL_BASE=${NEXT_PUBLIC_FILES_URL_BASE}
        - NEXT_PUBLIC_OMISE_PUBLIC_KEY=${NEXT_PUBLIC_OMISE_PUBLIC_KEY}
        - DATABASE_URL=${DATABASE_URL}
    container_name: yoye-muethong
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-https://yoyemuethong-dev.yoyemuethong.com}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - FILES_PUBLIC_URL_BASE=${FILES_PUBLIC_URL_BASE}
      - NEXT_PUBLIC_FILES_URL_BASE=${NEXT_PUBLIC_FILES_URL_BASE}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LINE_LOGIN_CHANNEL_ID=${LINE_LOGIN_CHANNEL_ID}
      - LINE_LOGIN_CHANNEL_SECRET=${LINE_LOGIN_CHANNEL_SECRET}
      - LINE_LOGIN_REDIRECT_URI=${LINE_LOGIN_REDIRECT_URI}
      - OMISE_SECRET_KEY=${OMISE_SECRET_KEY}
      - OMISE_API_VERSION=${OMISE_API_VERSION:-}
      - NEXT_PUBLIC_OMISE_PUBLIC_KEY=${NEXT_PUBLIC_OMISE_PUBLIC_KEY}
      # ฝากรูปหลักฐานรีวิวไปเก็บที่ yoye-admin (repo นี้ไม่มี uploader)
      # ADMIN_API_URL ชี้ไปที่ container ของแอดมินผ่านเน็ตเวิร์กเดียวกัน จึงใช้ชื่อ
      # service ตรง ๆ ได้ ไม่ต้องอ้อมออกอินเทอร์เน็ต และ INTERNAL_API_KEY ต้องตรงกับ
      # ค่าเดียวกันในคอมโพสของ yoye-admin ไม่งั้นอัปโหลดถูกปฏิเสธ 403
      - ADMIN_API_URL=${ADMIN_API_URL:-http://yoye-admin:3000}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-4yt9_host"
      - "traefik.http.routers.booking.rule=Host(`yoyemuethong-dev.yoyemuethong.com`)"
      - "traefik.http.routers.booking.entrypoints=websecure"
      - "traefik.http.routers.booking.tls.certresolver=letsencrypt"
      - "traefik.http.routers.booking.priority=1"
      - "traefik.http.services.booking.loadbalancer.server.port=3000"
    restart: always
    networks:
      - yoye-link

networks:
  yoye-link:
    external: true
    # Traefik's network, created by the traefik stack (same value as yoye-admin)
    name: traefik-4yt9_host
